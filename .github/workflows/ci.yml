name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      # Report every version independently — a failure on one must not cancel
      # the others and leave their status unknown.
      fail-fast: false
      matrix:
        # Node 18 reached end-of-life in April 2025 and is no longer testable here:
        # vitest >= 4.1.11 (required to clear GHSA-82fw-gwwq-j7x9, critical) pulls a
        # rolldown build that imports `styleText` from node:util, which Node 18 lacks,
        # so the test runner cannot start. `npm ci` and `npm run build` still pass on
        # Node 18, and package.json still declares engines >= 18.0.0 — but that floor
        # is no longer exercised by CI.
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
